<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Singing Quest - คาราโอเกะจับคีย์เสียง</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --primary-color: #38bdf8;
      --success-color: #22c55e;
      --danger-color: #ef4444;
      --warning-color: #f59e0b;
      --chord-color: #fb923c;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }

    .card-container {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 24px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .header-controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
      background: rgba(0,0,0,0.2);
      padding: 15px;
      border-radius: 12px;
    }

    .control-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    select {
      background: var(--card-bg);
      color: white;
      border: 1px solid var(--primary-color);
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      cursor: pointer;
      width: 100%;
    }

    .target-box {
      background: rgba(15, 23, 42, 0.8);
      border: 2px dashed var(--primary-color);
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .target-title { font-size: 13px; color: var(--text-muted); }
    .target-note { font-size: 24px; font-weight: 800; color: #fde047; margin: 4px 0; }
    .target-detail { font-size: 13px; color: var(--primary-color); }

    /* กล่องเนื้อเพลงแบบคาราโอเกะ */
    .lyric-box {
      background: rgba(0, 0, 0, 0.4);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      height: 120px;
      overflow-y: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      scroll-behavior: smooth;
    }

    .lyric-line {
      font-size: 16px;
      color: var(--text-muted);
      margin: 8px 0;
      transition: all 0.3s ease;
      opacity: 0.4;
      line-height: 1.4;
    }

    .lyric-line .chord {
      color: var(--chord-color);
      font-weight: 800;
      font-size: 14px;
    }

    .lyric-line.active {
      font-size: 19px;
      font-weight: bold;
      color: #fde047;
      opacity: 1;
      text-shadow: 0 0 10px rgba(253, 224, 71, 0.5);
      transform: scale(1.05);
    }
    .lyric-line.active .chord {
      font-size: 16px;
      color: var(--primary-color);
    }

    .timer-bar {
      height: 8px;
      background: #334155;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .timer-fill {
      height: 100%;
      background: var(--primary-color);
      width: 100%;
      transition: width 0.2s linear;
    }

    .feedback-box {
      height: 55px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      font-weight: 800;
      border-radius: 12px;
      background: rgba(255,255,255,0.05);
      transition: all 0.2s ease;
      margin-bottom: 12px;
    }

    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }

    .metric-card {
      background: rgba(15, 23, 42, 0.4);
      border-radius: 10px;
      padding: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .btn {
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
      color: white;
      margin-top: 6px;
    }

    .btn-start { background: var(--success-color); }
    .btn-start:disabled { background: #475569; cursor: not-allowed; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex; justify-content: center; align-items: center;
      z-index: 999;
    }
    .modal-content {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 24px;
      width: 85%;
      max-width: 320px;
      text-align: center;
      border: 2px solid var(--primary-color);
    }
  </style>
</head>
<body>

<div class="card-container">
  <h2 style="margin-top:0; color: var(--primary-color);">🎤 Singing Quest</h2>
  
  <div class="header-controls">
    <!-- เลือกคีย์ ชาย / หญิง -->
    <div class="control-group">
      <select id="gender-selector">
        <option value="male">👨 คีย์ผู้ชาย (โทนเสียงกลาง-ต่ำ)</option>
        <option value="female">👩 คีย์ผู้หญิง (โทนเสียงกลาง-สูง)</option>
      </select>
    </div>

    <!-- เลือกเพลง (3 เพลงหลัก) -->
    <div class="control-group">
      <select id="song-selector">
        <option value="0">🎵 เพลงไก่ย่างถูกเผา</option>
        <option value="1">🎵 เพลงรถตุ๊กตุ๊ก</option>
        <option value="2">🎵 เพลงระบำชาวเกาะ</option>
      </select>
    </div>

    <!-- เลือกระดับความเร็วในการเลื่อนเนื้อเพลง -->
    <div class="control-group">
      <select id="speed-selector">
        <option value="0.7">🐢 เนื้อเพลงเลื่อน: ช้า (0.7x)</option>
        <option value="1.0" selected>🚶‍♂️ เนื้อเพลงเลื่อน: ปกติ (1.0x)</option>
        <option value="1.5">🏃‍♂️ เนื้อเพลงเลื่อน: เร็ว (1.5x)</option>
      </select>
    </div>
  </div>
  
  <div class="target-box" style="margin-top: 10px;">
    <div class="target-title">ช่วงเสียงที่จับคะแนนเพลงนี้</div>
    <div class="target-note" id="song-name-display">ไก่ย่างถูกเผา</div>
    <div class="target-detail" id="target-detail-display">คีย์: ชาย | ช่วงเสียง: 110 - 180 Hz</div>
  </div>

  <!-- กล่องเนื้อเพลงคาราโอเกะแบบเลื่อนอัตโนมัติ -->
  <div class="lyric-box" id="lyric-display"></div>

  <div class="timer-bar">
    <div class="timer-fill" id="timer-fill"></div>
  </div>
  <!-- เวลาร้องฟิกซ์ที่ 20 วินาทีเสมอ -->
  <div style="text-align: right; font-size: 12px; margin-top: -8px; margin-bottom: 10px;" id="time-text">20 วินาที</div>

  <!-- กล่องแสดงผลแหกคีย์ Real-time -->
  <div class="feedback-box" id="feedback-box">พร้อมแล้วกดเริ่มจับเสียง!</div>
  
  <div class="metrics">
    <div class="metric-card">
      <span style="font-size: 10px; color: var(--text-muted)">เสียงสด</span>
      <div id="current-hz" style="font-size: 16px; font-weight: bold; color: white;">-- Hz</div>
    </div>
    <div class="metric-card">
      <span style="font-size: 10px; color: var(--text-muted)">ความแม่นยำ</span>
      <div id="score-display" style="font-size: 16px; font-weight: bold; color: var(--success-color);">0%</div>
    </div>
    <div class="metric-card">
      <span style="font-size: 10px; color: var(--text-muted)">แหกคีย์ไป</span>
      <div id="offkey-count" style="font-size: 16px; font-weight: bold; color: var(--danger-color);">0 ครั้ง</div>
    </div>
  </div>

  <button id="start-btn" class="btn btn-start">🎙️ กดเพื่อเริ่มจับเสียงร้อง</button>
</div>

<!-- Modal สรุปผล -->
<div id="result-modal" class="modal-overlay" style="display: none;">
  <div class="modal-content">
    <h1 id="modal-title" style="margin-top:0;">🎉 ผลการประเมิน</h1>
    <h2 id="modal-score" style="font-size: 40px; color: #fde047; margin: 10px 0;">80%</h2>
    <p id="modal-detail" style="font-size: 14px; color: var(--text-muted);">ร้องตรงคีย์ได้ดี!</p>
    <button id="close-modal-btn" class="btn btn-start" style="margin-top: 15px;">ตกลง</button>
  </div>
</div>

<script>
  // ความยาวเกม 20 วินาทีเท่ากันหมด
  const GAME_DURATION = 20;

  // ปรับช่วง minHz - maxHz ให้กว้างขึ้นเพื่อให้ร้องผ่านได้จริง (ยืดหยุ่นต่อเสียงสั่นและการเอื้อน)
  const songsData = [
    {
      id: 0,
      title: "ไก่ย่างถูกเผา",
      keys: {
        male: { targetHz: 147, minHz: 110, maxHz: 180, label: "ผู้ชาย" },
        female: { targetHz: 294, minHz: 230, maxHz: 350, label: "ผู้หญิง" }
      },
      lines: [
        "[D] ไก่ย่างถูกเผา [D] ไก่ย่างถูกเผา",
        "[A] มันจะถูกไม้เสียบ (อู๊ย!)",
        "[G] เสียบตูดซ้าย [D] เสียบตูดขวา",
        "[A] ร้อนจริง ๆ [D] ร้อนจริง ๆ ร้อนจริง ๆ"
      ]
    },
    {
      id: 1,
      title: "รถตุ๊กตุ๊ก",
      keys: {
        male: { targetHz: 130, minHz: 100, maxHz: 170, label: "ผู้ชาย" },
        female: { targetHz: 262, minHz: 210, maxHz: 330, label: "ผู้หญิง" }
      },
      lines: [
        "[C] รถตุ๊กตุ๊ก [G] บรรทุกถ่าน",
        "[C] รถขึ้นสะพาน รถลงสะพาน",
        "[F] รถเลี้ยวซ้าย [G] รถเลี้ยวขวา",
        "[C] ชักกระตุก ชักกระตุก ชักกระตุก ชักกระตุก"
      ]
    },
    {
      id: 2,
      title: "ระบำชาวเกาะ",
      keys: {
        male: { targetHz: 165, minHz: 120, maxHz: 195, label: "ผู้ชาย" },
        female: { targetHz: 330, minHz: 250, maxHz: 380, label: "ผู้หญิง" }
      },
      lines: [
        "[E] รำระบำชาวเกาะ",
        "[A] ไพเราะเสนาะจับใจ",
        "[B] สายน้ำหลั่งไหล [B] สายน้ำหลั่งไหล",
        "[E] กระทบหาดทรายดังครืนครืน"
      ]
    }
  ];

  let currentSongIdx = 0;
  let currentGender = 'male';
  
  let audioCtx, analyser, stream, dataArray;
  let isRunning = false;
  let gameTimer = null;
  let timeLeft = GAME_DURATION;
  let totalFrames = 0;
  let goodFrames = 0;
  let offKeyCount = 0;
  let lastStateWasOffkey = false;

  const genderSelector = document.getElementById('gender-selector');
  const songSelector = document.getElementById('song-selector');
  const speedSelector = document.getElementById('speed-selector');
  
  const songNameDisplay = document.getElementById('song-name-display');
  const targetDetailDisplay = document.getElementById('target-detail-display');
  const lyricDisplay = document.getElementById('lyric-display');
  const timerFill = document.getElementById('timer-fill');
  const timeText = document.getElementById('time-text');
  const feedbackBox = document.getElementById('feedback-box');
  const currentHzDisplay = document.getElementById('current-hz');
  const scoreDisplay = document.getElementById('score-display');
  const offkeyCountDisplay = document.getElementById('offkey-count');
  const startBtn = document.getElementById('start-btn');

  // สร้างเนื้อเพลงคาราโอเกะ
  function renderLyrics() {
    lyricDisplay.innerHTML = "";
    let linesArray = songsData[currentSongIdx].lines;
    linesArray.forEach((lineText, index) => {
      let div = document.createElement("div");
      div.className = "lyric-line";
      div.id = "lyric-" + index;
      
      let formattedLine = lineText.replace(/\[(.*?)\]/g, '<span class="chord">[$1]</span>');
      div.innerHTML = formattedLine;
      
      lyricDisplay.appendChild(div);
    });
  }

  // อัปเดตเลื่อนเนื้อเพลงตามความเร็วที่เลือก
  function updateKaraoke(timeLeftLocal) {
    if (!isRunning) return;
    
    let actualElapsedTime = GAME_DURATION - timeLeftLocal;
    let speedMult = parseFloat(speedSelector.value);
    let lyricElapsedTime = actualElapsedTime * speedMult;

    let linesArray = songsData[currentSongIdx].lines;
    let totalLines = linesArray.length;
    let timePerLine = GAME_DURATION / totalLines;
    
    let currentLineIdx = Math.floor(lyricElapsedTime / timePerLine);
    if (currentLineIdx >= totalLines) currentLineIdx = totalLines - 1;

    document.querySelectorAll('.lyric-line').forEach(el => el.classList.remove('active'));
    let activeLine = document.getElementById('lyric-' + currentLineIdx);
    if (activeLine) {
      activeLine.classList.add('active');
      lyricDisplay.scrollTop = activeLine.offsetTop - (lyricDisplay.offsetHeight / 2) + (activeLine.offsetHeight / 2);
    }
  }

  // โหลดการตั้งค่าเริ่มต้น
  function loadSongSettings() {
    let song = songsData[currentSongIdx];
    let keyInfo = song.keys[currentGender];
    
    songNameDisplay.innerText = song.title;
    targetDetailDisplay.innerText = `คีย์: ${keyInfo.label} | ขอบเขตเสียง: ${keyInfo.minHz} - ${keyInfo.maxHz} Hz`;
    
    renderLyrics();
    
    timeLeft = GAME_DURATION;
    timeText.innerText = `${timeLeft} วินาที`;
    timerFill.style.width = "100%";
    feedbackBox.innerText = "พร้อมแล้วกดเริ่มจับเสียง!";
    feedbackBox.style.background = "rgba(255,255,255,0.05)";
    feedbackBox.style.color = "white";
    currentHzDisplay.innerText = "-- Hz";
    scoreDisplay.innerText = "0%";
    offkeyCountDisplay.innerText = "0 ครั้ง";
    offKeyCount = 0;
  }

  genderSelector.addEventListener('change', (e) => { currentGender = e.target.value; loadSongSettings(); });
  songSelector.addEventListener('change', (e) => { currentSongIdx = parseInt(e.target.value); loadSongSettings(); });
  speedSelector.addEventListener('change', loadSongSettings);

  // อัลกอริทึม Auto-correlation
  function autoCorrelate(buf, sampleRate) {
    let SIZE = buf.length, rms = 0;
    for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
    rms = Math.sqrt(rms / SIZE);
    if (rms < 0.015) return -1;
    
    let r1 = 0, r2 = SIZE - 1, thres = 0.2;
    for (let i = 0; i < SIZE / 2; i++) { if (Math.abs(buf[i]) < thres) { r1 = i; break; } }
    for (let i = 1; i < SIZE / 2; i++) { if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; } }
    buf = buf.slice(r1, r2); SIZE = buf.length;
    let c = new Array(SIZE).fill(0);
    for (let i = 0; i < SIZE; i++) {
      for (let j = 0; j < SIZE - i; j++) c[i] += buf[j] * buf[j + i];
    }
    let d = 0; while (c[d] > c[d + 1]) d++;
    let maxval = -1, maxpos = -1;
    for (let i = d; i < SIZE; i++) {
      if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
    }
    return sampleRate / maxpos;
  }

  // กดเริ่มจับเสียง
  startBtn.addEventListener('click', async () => {
    try {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      
      stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }

      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      
      let source = audioCtx.createMediaStreamSource(stream);
      source.connect(analyser);
      
      dataArray = new Float32Array(analyser.fftSize);

      totalFrames = 0; goodFrames = 0; offKeyCount = 0;
      genderSelector.disabled = true;
      songSelector.disabled = true;
      speedSelector.disabled = true;
      
      isRunning = true;
      startBtn.disabled = true;
      startBtn.innerText = "กำลังจับเสียงร้อง...";

      updateKaraoke(timeLeft);

      gameTimer = setInterval(() => {
        timeLeft--;
        let pct = (timeLeft / GAME_DURATION) * 100;
        timerFill.style.width = Math.max(0, pct) + "%";
        timeText.innerText = `${timeLeft} วินาที`;

        updateKaraoke(timeLeft);

        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);

      updatePitch();
    } catch (err) {
      console.error(err);
      alert("ไม่สามารถเปิดไมโครโฟนได้ กรุณาตรวจสอบการอนุญาตสิทธิ์ (Permission) ของเบราว์เซอร์");
    }
  });

  function updatePitch() {
    if (!isRunning) return;
    
    analyser.getFloatTimeDomainData(dataArray);
    let pitch = autoCorrelate(dataArray, audioCtx.sampleRate);
    let keyInfo = songsData[currentSongIdx].keys[currentGender];

    if (pitch !== -1) {
      let hz = Math.round(pitch);
      currentHzDisplay.innerText = hz + " Hz";
      totalFrames++;

      if (hz >= keyInfo.minHz && hz <= keyInfo.maxHz) {
        feedbackBox.innerText = "🎯 เสียงอยู่ในคีย์แล้ว!";
        feedbackBox.style.background = "rgba(34, 197, 94, 0.2)";
        feedbackBox.style.color = "var(--success-color)";
        goodFrames++;
        lastStateWasOffkey = false;
      } else {
        if (hz > keyInfo.maxHz) {
          feedbackBox.innerText = "⚠️ แหกคีย์! เสียงสูงเกินไป";
        } else {
          feedbackBox.innerText = "⚠️ แหกคีย์! เสียงต่ำเกินไป";
        }
        feedbackBox.style.background = "rgba(239, 68, 68, 0.25)";
        feedbackBox.style.color = "var(--danger-color)";

        if (!lastStateWasOffkey) {
          offKeyCount++;
          offkeyCountDisplay.innerText = offKeyCount + " ครั้ง";
          lastStateWasOffkey = true;
        }
      }

      let percent = Math.round((goodFrames / totalFrames) * 100);
      scoreDisplay.innerText = percent + "%";
    }
    
    requestAnimationFrame(updatePitch);
  }

  function endGame() {
    isRunning = false;
    clearInterval(gameTimer);
    
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
    }

    startBtn.disabled = false;
    startBtn.innerText = "🎙️ กดเพื่อเริ่มจับเสียงร้อง";
    genderSelector.disabled = false;
    songSelector.disabled = false;
    speedSelector.disabled = false;

    let finalScore = totalFrames > 0 ? Math.round((goodFrames / totalFrames) * 100) : 0;
    
    let modal = document.getElementById('result-modal');
    let title = document.getElementById('modal-title');
    let scoreText = document.getElementById('modal-score');
    let detailText = document.getElementById('modal-detail');
    let closeBtn = document.getElementById('close-modal-btn');

    scoreText.innerText = finalScore + "%";
    detailText.innerText = `มีช่วงร้องหลุด/แหกคีย์ทั้งหมด ${offKeyCount} ครั้ง`;

    if (finalScore >= 60) {
      title.innerText = "🎉 เสียงดีอยู่ในคีย์!";
      title.style.color = "var(--success-color)";
    } else {
      title.innerText = "❌ หลุดคีย์บ่อย";
      title.style.color = "var(--danger-color)";
    }

    closeBtn.onclick = () => { 
      modal.style.display = "none"; 
      loadSongSettings(); 
    };
    modal.style.display = "flex";
  }

  // เรียกใช้ครั้งแรกตอนเปิดหน้าเว็บ
  loadSongSettings();
</script>

</body>
</html>
