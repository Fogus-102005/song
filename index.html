<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Singing Quest V2 - แอปฝึกร้องเพลง & จับตัวแหกคีย์</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --primary-color: #38bdf8;
      --success-color: #22c55e;
      --danger-color: #ef4444;
      --warning-color: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }

    .card-container {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 20px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .header-controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
      background: rgba(0,0,0,0.2);
      padding: 15px;
      border-radius: 12px;
    }

    .control-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    select, .btn-small {
      background: var(--card-bg);
      color: white;
      border: 1px solid var(--primary-color);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      cursor: pointer;
      width: 100%;
    }

    .target-box {
      background: rgba(15, 23, 42, 0.8);
      border: 2px dashed var(--primary-color);
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .target-title { font-size: 13px; color: var(--text-muted); }
    .target-note { font-size: 26px; font-weight: 800; color: #fde047; margin: 4px 0; }
    .target-detail { font-size: 13px; color: var(--primary-color); }

    .lyric-box {
      background: rgba(0, 0, 0, 0.4);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 15px;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fde047;
      font-size: 18px;
      font-weight: bold;
    }

    .timer-bar {
      height: 8px;
      background: #334155;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .timer-fill {
      height: 100%;
      background: var(--primary-color);
      width: 100%;
      transition: width 0.2s linear;
    }

    .feedback-box {
      height: 55px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      font-weight: 800;
      border-radius: 12px;
      background: rgba(255,255,255,0.05);
      transition: all 0.2s ease;
      margin-bottom: 12px;
    }

    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }

    .metric-card {
      background: rgba(15, 23, 42, 0.4);
      border-radius: 10px;
      padding: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .btn {
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
      color: white;
      margin-top: 6px;
    }

    .btn-listen { background: #0284c7; }
    .btn-start { background: var(--success-color); }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex; justify-content: center; align-items: center;
      z-index: 999;
    }
    .modal-content {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 24px;
      width: 85%;
      max-width: 320px;
      text-align: center;
      border: 2px solid var(--primary-color);
    }
  </style>
</head>
<body>

<div class="card-container">
  <h2 style="margin-top:0; color: var(--primary-color);">🎤 Singing Quest V2</h2>
  
  <div class="header-controls">
    <!-- เลือกเพลง (คีย์ ช/ญ ชัดเจน) -->
    <div class="control-group">
      <select id="song-selector">
        <option value="0">🎵 เพลงเมาคลีล่าสัตว์ (คีย์ ชาย - C3)</option>
        <option value="1">🎵 เพลงไก่ย่างถูกเผา (คีย์ ชาย - D3)</option>
        <option value="2">🎵 เพลงรถตุ๊กตุ๊ก (คีย์ หญิง - C4)</option>
        <option value="3">🎵 เพลงแจวเรือ (คีย์ หญิง - D4)</option>
      </select>
    </div>

    <!-- เลือกจังหวะ -->
    <div class="control-group">
      <select id="rhythm-selector" style="flex: 1;">
        <option value="3cha">🥁 จังหวะ: 3 ช่า</option>
        <option value="conga">🪘 จังหวะ: คองก้า</option>
      </select>
      <button id="bgm-btn" class="btn-small" style="width: 110px;">▶️ เปิดจังหวะ</button>
    </div>
  </div>

  <!-- ปุ่มฟังตัวอย่างเสียงเมโลดี้ -->
  <button id="listen-btn" class="btn btn-listen">🎧 ฟังตัวอย่างเสียง (ร้องตามคีย์นี้)</button>
  
  <div class="target-box" style="margin-top: 10px;">
    <div class="target-title">คีย์เป้าหมายของเพลงนี้</div>
    <div class="target-note" id="song-name-display">เมาคลีล่าสัตว์ (คีย์ ช)</div>
    <div class="target-detail" id="target-detail-display">คีย์: C3 | ช่วงเสียง: 120 - 140 Hz</div>
  </div>

  <div class="lyric-box" id="lyric-display">"เมาคลีล่าสัตว์ เมาคลีล่าสัตว์..."</div>

  <div class="timer-bar">
    <div class="timer-fill" id="timer-fill"></div>
  </div>
  <div style="text-align: right; font-size: 12px; margin-top: -8px; margin-bottom: 10px;" id="time-text">20 วินาที</div>

  <!-- กล่องแสดงตัวแหกคีย์ Real-time -->
  <div class="feedback-box" id="feedback-box">พร้อมแล้วกดเริ่มจับเสียง!</div>
  
  <div class="metrics">
    <div class="metric-card">
      <span style="font-size: 10px; color: var(--text-muted)">เสียงสด</span>
      <div id="current-hz" style="font-size: 16px; font-weight: bold; color: white;">-- Hz</div>
    </div>
    <div class="metric-card">
      <span style="font-size: 10px; color: var(--text-muted)">ความแม่นยำ</span>
      <div id="score-display" style="font-size: 16px; font-weight: bold; color: var(--success-color);">0%</div>
    </div>
    <div class="metric-card">
      <span style="font-size: 10px; color: var(--text-muted)">แหกคีย์ไป</span>
      <div id="offkey-count" style="font-size: 16px; font-weight: bold; color: var(--danger-color);">0 ครั้ง</div>
    </div>
  </div>

  <button id="start-btn" class="btn btn-start">🎙️ กดเพื่อเริ่มจับเสียงร้อง</button>
</div>

<!-- Modal สรุปผล -->
<div id="result-modal" class="modal-overlay" style="display: none;">
  <div class="modal-content">
    <h1 id="modal-title" style="margin-top:0;">🎉 ผลการประเมิน</h1>
    <h2 id="modal-score" style="font-size: 40px; color: #fde047; margin: 10px 0;">80%</h2>
    <p id="modal-detail" style="font-size: 14px; color: var(--text-muted);">ร้องตรงคีย์ได้ดี!</p>
    <button id="close-modal-btn" class="btn btn-start" style="margin-top: 15px;">ตกลง</button>
  </div>
</div>

<script>
  // รายการเพลงที่มีคีย์ ชาย/หญิง ชัดเจน
  const songList = [
    {
      id: 0,
      title: "เมาคลีล่าสัตว์ (คีย์ ชาย)",
      keyName: "C3 (ชาย)",
      targetHz: 130,
      minHz: 120,
      maxHz: 140,
      lyrics: "เมาคลีล่าสัตว์... ฆ่าแชร์คาน...",
      duration: 20
    },
    {
      id: 1,
      title: "ไก่ย่างถูกเผา (คีย์ ชาย)",
      keyName: "D3 (ชาย)",
      targetHz: 147,
      minHz: 137,
      maxHz: 157,
      lyrics: "ไก่ย่างถูกเผา... มันจะถูกไม้เสียบ...",
      duration: 20
    },
    {
      id: 2,
      title: "รถตุ๊กตุ๊ก (คีย์ หญิง)",
      keyName: "C4 (หญิง)",
      targetHz: 262,
      minHz: 248,
      maxHz: 276,
      lyrics: "ขับรถตุ๊กตุ๊ก... บรรทุกถ่าน...",
      duration: 20
    },
    {
      id: 3,
      title: "แจวเรือ (คีย์ หญิง)",
      keyName: "D4 (หญิง)",
      targetHz: 294,
      minHz: 280,
      maxHz: 308,
      lyrics: "แจวมาแจวจ้ำจึก... น้ำนิ่งไหลลึก...",
      duration: 20
    }
  ];

  let currentSongIdx = 0;
  let audioCtx, analyser, stream, dataArray;
  let isRunning = false;
  let gameTimer = null;
  let timeLeft = 0;
  let totalFrames = 0;
  let goodFrames = 0;
  let offKeyCount = 0;
  let lastStateWasOffkey = false;

  // โหลดข้อมูลเพลง
  const songSelector = document.getElementById('song-selector');
  const songNameDisplay = document.getElementById('song-name-display');
  const targetDetailDisplay = document.getElementById('target-detail-display');
  const lyricDisplay = document.getElementById('lyric-display');
  const timerFill = document.getElementById('timer-fill');
  const timeText = document.getElementById('time-text');
  const feedbackBox = document.getElementById('feedback-box');
  const currentHzDisplay = document.getElementById('current-hz');
  const scoreDisplay = document.getElementById('score-display');
  const offkeyCountDisplay = document.getElementById('offkey-count');
  const startBtn = document.getElementById('start-btn');
  const listenBtn = document.getElementById('listen-btn');

  function loadSongSettings() {
    let song = songList[currentSongIdx];
    songNameDisplay.innerText = song.title;
    targetDetailDisplay.innerText = `คีย์สากล: ${song.keyName} | พิกัดเป้าหมาย: ${song.minHz} - ${song.maxHz} Hz`;
    lyricDisplay.innerText = `"${song.lyrics}"`;
    timeLeft = song.duration;
    timeText.innerText = `${timeLeft} วินาที`;
    timerFill.style.width = "100%";
    feedbackBox.innerText = "พร้อมแล้วกดเริ่มจับเสียง!";
    feedbackBox.style.background = "rgba(255,255,255,0.05)";
    feedbackBox.style.color = "white";
    currentHzDisplay.innerText = "-- Hz";
    scoreDisplay.innerText = "0%";
    offkeyCountDisplay.innerText = "0 ครั้ง";
    offKeyCount = 0;
  }

  songSelector.addEventListener('change', (e) => {
    currentSongIdx = parseInt(e.target.value);
    loadSongSettings();
  });

  // ปุ่มฟังตัวอย่างเสียงร้อง
  listenBtn.onclick = () => {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    
    let song = songList[currentSongIdx];
    osc.type = 'sine';
    osc.frequency.setValueAtTime(song.targetHz, ctx.currentTime);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    
    osc.connect(gain);
    gain.connect(ctx.destination);
    
    osc.start();
    osc.stop(ctx.currentTime + 2.0); // เล่นเสียงยาว 2 วินาที
  };

  // ระบบวัดความถี่เสียง
  function autoCorrelate(buf, sampleRate) {
    let SIZE = buf.length, rms = 0;
    for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
    rms = Math.sqrt(rms / SIZE);
    if (rms < 0.015) return -1;
    
    let r1 = 0, r2 = SIZE - 1, thres = 0.2;
    for (let i = 0; i < SIZE / 2; i++) { if (Math.abs(buf[i]) < thres) { r1 = i; break; } }
    for (let i = 1; i < SIZE / 2; i++) { if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; } }
    buf = buf.slice(r1, r2); SIZE = buf.length;
    let c = new Array(SIZE).fill(0);
    for (let i = 0; i < SIZE; i++) {
      for (let j = 0; j < SIZE - i; j++) c[i] += buf[j] * buf[j + i];
    }
    let d = 0; while (c[d] > c[d + 1]) d++;
    let maxval = -1, maxpos = -1;
    for (let i = d; i < SIZE; i++) {
      if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
    }
    return sampleRate / maxpos;
  }

  startBtn.onclick = async () => {
    try {
      totalFrames = 0; goodFrames = 0; offKeyCount = 0;
      songSelector.disabled = true;

      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      await audioCtx.resume();
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      audioCtx.createMediaStreamSource(stream).connect(analyser);
      dataArray = new Float32Array(analyser.fftSize);

      isRunning = true;
      startBtn.disabled = true;
      startBtn.innerText = "กำลังจับเสียงร้อง...";

      gameTimer = setInterval(() => {
        timeLeft--;
        let pct = (timeLeft / songList[currentSongIdx].duration) * 100;
        timerFill.style.width = pct + "%";
        timeText.innerText = `${timeLeft} วินาที`;

        if (timeLeft <= 0) endGame();
      }, 1000);

      updatePitch();
    } catch (err) {
      alert("กรุณาอนุญาตการใช้ไมโครโฟนบนเบราว์เซอร์ก่อนเปิดแอปครับ");
      songSelector.disabled = false;
    }
  };

  function updatePitch() {
    if (!isRunning) return;
    analyser.getFloatTimeDomainData(dataArray);
    let pitch = autoCorrelate(dataArray, audioCtx.sampleRate);
    let song = songList[currentSongIdx];

    if (pitch !== -1) {
      let hz = Math.round(pitch);
      currentHzDisplay.innerText = hz + " Hz";
      totalFrames++;

      // ตรวจจับคีย์เป้าหมายและหาตัวแหกคีย์
      if (hz >= song.minHz && hz <= song.maxHz) {
        feedbackBox.innerText = "🎯 เสียงตรงคีย์แล้ว!";
        feedbackBox.style.background = "rgba(34, 197, 94, 0.2)";
        feedbackBox.style.color = "var(--success-color)";
        goodFrames++;
        lastStateWasOffkey = false;
      } else {
        // ตัวแหกคีย์!
        if (hz > song.maxHz) {
          feedbackBox.innerText = "⚠️ แหกคีย์! เสียงสูงเกินไป";
        } else {
          feedbackBox.innerText = "⚠️ แหกคีย์! เสียงต่ำเกินไป";
        }
        feedbackBox.style.background = "rgba(239, 68, 68, 0.25)";
        feedbackBox.style.color = "var(--danger-color)";

        if (!lastStateWasOffkey) {
          offKeyCount++;
          offkeyCountDisplay.innerText = offKeyCount + " ครั้ง";
          lastStateWasOffkey = true;
        }
      }

      let percent = Math.round((goodFrames / totalFrames) * 100);
      scoreDisplay.innerText = percent + "%";
    }
    requestAnimationFrame(updatePitch);
  }

  function endGame() {
    isRunning = false;
    clearInterval(gameTimer);
    if (stream) stream.getTracks().forEach(t => t.stop());

    startBtn.disabled = false;
    startBtn.innerText = "🎙️ กดเพื่อเริ่มจับเสียงร้อง";
    songSelector.disabled = false;

    let finalScore = totalFrames > 0 ? Math.round((goodFrames / totalFrames) * 100) : 0;
    
    let modal = document.getElementById('result-modal');
    let title = document.getElementById('modal-title');
    let scoreText = document.getElementById('modal-score');
    let detailText = document.getElementById('modal-detail');
    let closeBtn = document.getElementById('close-modal-btn');

    scoreText.innerText = finalScore + "%";
    detailText.innerText = `มีช่วงร้องหลุด/แหกคีย์ทั้งหมด ${offKeyCount} ครั้ง`;

    if (finalScore >= 60) {
      title.innerText = "🎉 เสียงดีตรงคีย์!";
      title.style.color = "var(--success-color)";
    } else {
      title.innerText = "❌ หลุดคีย์บ่อย";
      title.style.color = "var(--danger-color)";
    }

    closeBtn.onclick = () => { modal.style.display = "none"; loadSongSettings(); };
    modal.style.display = "flex";
  }

  // ระบบเสียงกลอง
  let drumCtx, beatInterval, drumStep = 0, isBgmPlaying = false;
  const bgmBtn = document.getElementById('bgm-btn');
  const rhythmSelector = document.getElementById('rhythm-selector');

  bgmBtn.onclick = () => {
    if (isBgmPlaying) {
      clearInterval(beatInterval);
      bgmBtn.innerText = "▶️ เปิดจังหวะ";
    } else {
      if (!drumCtx) drumCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (drumCtx.state === 'suspended') drumCtx.resume();
      drumStep = 0;
      beatInterval = setInterval(() => {
        let now = drumCtx.currentTime;
        let osc = drumCtx.createOscillator();
        let gain = drumCtx.createGain();
        osc.connect(gain); gain.connect(drumCtx.destination);
        
        if (rhythmSelector.value === '3cha') {
          if (drumStep % 4 === 0) {
            osc.frequency.setValueAtTime(120, now);
            gain.gain.setValueAtTime(0.6, now);
            osc.start(now); osc.stop(now + 0.1);
          }
        } else {
          if (drumStep % 2 === 0) {
            osc.frequency.setValueAtTime(200, now);
            gain.gain.setValueAtTime(0.4, now);
            osc.start(now); osc.stop(now + 0.1);
          }
        }
        drumStep = (drumStep + 1) % 16;
      }, 125);
      bgmBtn.innerText = "⏸️ ปิดจังหวะ";
    }
    isBgmPlaying = !isBgmPlaying;
  };

  loadSongSettings();
</script>

</body>
</html>
