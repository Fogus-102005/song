<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pitch & Sing Game - คาราโอเกะ & จังหวะดนตรี</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --primary-color: #38bdf8;
      --success-color: #22c55e;
      --danger-color: #ef4444;
      --warning-color: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .card-container {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 24px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .header-controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
      background: rgba(0,0,0,0.2);
      padding: 15px;
      border-radius: 12px;
    }

    .control-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .level-badge {
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: white;
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 700;
      white-space: nowrap;
    }

    select, .btn-small {
      background: var(--card-bg);
      color: white;
      border: 1px solid var(--primary-color);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }
    
    .btn-small:hover {
      background: rgba(56, 189, 248, 0.2);
    }

    .target-box {
      background: rgba(15, 23, 42, 0.8);
      border: 2px dashed var(--primary-color);
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .target-title { font-size: 14px; color: var(--text-muted); }
    .target-note { font-size: 36px; font-weight: 900; color: #fde047; margin: 5px 0; text-shadow: 0 0 10px rgba(253, 224, 71, 0.3); }
    .target-detail { font-size: 13px; color: var(--primary-color); }

    .lyric-box {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
      height: 120px;
      overflow-y: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      scroll-behavior: smooth;
    }

    .lyric-line {
      font-size: 16px;
      color: var(--text-muted);
      margin: 8px 0;
      transition: all 0.3s ease;
      opacity: 0.5;
    }

    .lyric-line.active {
      font-size: 20px;
      font-weight: bold;
      color: #fde047;
      opacity: 1;
      text-shadow: 0 0 10px rgba(253, 224, 71, 0.5);
      transform: scale(1.1);
    }

    .timer-bar {
      height: 10px;
      background: #334155;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 15px;
    }

    .timer-fill {
      height: 100%;
      background: var(--primary-color);
      width: 100%;
      transition: width 1s linear;
    }

    .feedback-box {
      height: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      font-weight: 800;
      border-radius: 12px;
      background: rgba(255,255,255,0.05);
      transition: all 0.2s ease;
      margin-bottom: 15px;
    }

    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .metric-card {
      background: rgba(15, 23, 42, 0.4);
      border-radius: 12px;
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .btn {
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
      color: white;
    }

    .btn-start { background: var(--success-color); box-shadow: 0 4px 15px rgba(34,197,94,0.3); }
    .btn-next { background: var(--primary-color); display: none; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex; justify-content: center; align-items: center;
      z-index: 999;
    }
    .modal-content {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 30px;
      width: 85%;
      max-width: 320px;
      text-align: center;
      border: 2px solid var(--primary-color);
    }
  </style>
</head>

        "เบอร์หนึ่งเบอร์สองเบอร์สาม",
        "พัดลมเพดานหมุนเป็นวงกลม",
        "พัด พัด พัด พัดลม",
        "พัด พัดลมเพดาน",
        "(วนซ้ำ...)"
      ]

  ];

  let currentLevelIdx = 0;
  let currentSongIdx = 0;
  let audioCtx, analyser, stream, dataArray;
  let isRunning = false;
  let gameTimer = null;
  let timeLeft = 0;
  let totalFrames = 0;
  let goodFrames = 0;
  
  // ==========================================
  // ระบบเครื่องตีจังหวะ (Drum Synthesizer)
  // ==========================================
  let drumCtx;
  let isBgmPlaying = false;
  let drumStep = 0;
  let beatInterval;

  function createDrumContext() {
    if (!drumCtx) drumCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (drumCtx.state === 'suspended') drumCtx.resume();
  }

  function playKick(time) {
    const osc = drumCtx.createOscillator();
    const gain = drumCtx.createGain();
    osc.connect(gain);
    gain.connect(drumCtx.destination);
    osc.frequency.setValueAtTime(150, time);
    osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.5);
    gain.gain.setValueAtTime(1, time);
    gain.gain.exponentialRampToValueAtTime(0.01, time + 0.5);
    osc.start(time);
    osc.stop(time + 0.5);
  }

  function playSnare(time) {
    const noise = drumCtx.createBufferSource();
    const buffer = drumCtx.createBuffer(1, drumCtx.sampleRate * 0.2, drumCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    noise.buffer = buffer;
    const noiseFilter = drumCtx.createBiquadFilter();
    noiseFilter.type = 'highpass';
    noiseFilter.frequency.value = 1000;
    const noiseGain = drumCtx.createGain();
    noiseGain.gain.setValueAtTime(0.7, time);
    noiseGain.gain.exponentialRampToValueAtTime(0.01, time + 0.2);
    noise.connect(noiseFilter);
    noiseFilter.connect(noiseGain);
    noiseGain.connect(drumCtx.destination);
    noise.start(time);
  }

  function playHihat(time) {
    const noise = drumCtx.createBufferSource();
    const buffer = drumCtx.createBuffer(1, drumCtx.sampleRate * 0.1, drumCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    noise.buffer = buffer;
    const noiseFilter = drumCtx.createBiquadFilter();
    noiseFilter.type = 'highpass';
    noiseFilter.frequency.value = 5000;
    const noiseGain = drumCtx.createGain();
    noiseGain.gain.setValueAtTime(0.2, time);
    noiseGain.gain.exponentialRampToValueAtTime(0.01, time + 0.1);
    noise.connect(noiseFilter);
    noiseFilter.connect(noiseGain);
    noiseGain.connect(drumCtx.destination);
    noise.start(time);
  }

  // เสียงคองก้า
  function playConga(time, freq) {
    const osc = drumCtx.createOscillator();
    const gain = drumCtx.createGain();
    osc.connect(gain);
    gain.connect(drumCtx.destination);
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, time);
    osc.frequency.exponentialRampToValueAtTime(freq * 0.7, time + 0.2);
    gain.gain.setValueAtTime(0.8, time);
    gain.gain.exponentialRampToValueAtTime(0.01, time + 0.2);
    osc.start(time);
    osc.stop(time + 0.2);
  }

  const bgmBtn = document.getElementById('bgm-btn');
  const rhythmSelector = document.getElementById('rhythm-selector');
  
  bgmBtn.onclick = () => {

      clearInterval(beatInterval);
      bgmBtn.innerText = "▶️ เปิดจังหวะ";
      bgmBtn.style.background = "var(--card-bg)";
    } else {
      createDrumContext();
      drumStep = 0;
      
      beatInterval = setInterval(() => {
        const now = drumCtx.currentTime;
        const currentRhythm = rhythmSelector.value;

        if (currentRhythm === '3cha') {
          // จังหวะ 3 ช่า: ตึง โป๊ะ ตึง-ตึง โป๊ะ
          if (drumStep === 0 || drumStep === 6 || drumStep === 8) playKick(now);
          if (drumStep === 4 || drumStep === 12) playSnare(now);
          if (drumStep % 2 === 0) playHihat(now); 
        } else if (currentRhythm === 'conga') {
          // จังหวะคองก้า: ต่ำ...สูง..กลาง..สูง
          if (drumStep === 0 || drumStep === 8) {
            playConga(now, 150); 
            playKick(now); 
          }
          if (drumStep === 4 || drumStep === 12) {
            playConga(now, 280); 
          }
          if (drumStep === 6 || drumStep === 14) {
            playConga(now, 200); 
          }
          if (drumStep % 2 === 0) playHihat(now); 
        }
        
        drumStep = (drumStep + 1) % 16;
      }, 125); 
      bgmBtn.innerText = "⏸️ ปิดจังหวะ";
      bgmBtn.style.background = "rgba(56, 189, 248, 0.5)";
    }

  function renderLyrics() {
    lyricDisplay.innerHTML = "";
    let linesArray = songs[currentSongIdx].lines;
    linesArray.forEach((lineText, index) => {
      let div = document.createElement("div");
      div.className = "lyric-line";
      div.id = "lyric-" + index;
      div.innerText = lineText;
      lyricDisplay.appendChild(div);
    });
  }

  function updateKaraoke(timeLeftLocal) {
    if (!isRunning) return;
    let totalTime = levels[currentLevelIdx].time;
    let elapsedTime = totalTime - timeLeftLocal;
    let linesArray = songs[currentSongIdx].lines;
    let totalLines = linesArray.length;
    
    let timePerLine = totalTime / totalLines;
    let currentLineIdx = Math.floor(elapsedTime / timePerLine);
    
    if (currentLineIdx >= totalLines) currentLineIdx = totalLines - 1;

    document.querySelectorAll('.lyric-line').forEach(el => el.classList.remove('active'));
    let activeLine = document.getElementById('lyric-' + currentLineIdx);
    if (activeLine) {
      activeLine.classList.add('active');
      lyricDisplay.scrollTop = activeLine.offsetTop - (lyricDisplay.offsetHeight / 2) + (activeLine.offsetHeight / 2);
    }
  }

  function loadSettings() {
    let lvl = levels[currentLevelIdx];
    levelDisplay.innerText = `ด่านที่ ${lvl.id} / ${levels.length}`;
    levelSelector.value = currentLevelIdx;
    targetNoteDisplay.innerText = lvl.noteName;
    targetDetailDisplay.innerText = `(${lvl.detail}) | พิกัดเสียง: ${lvl.targetHz - lvl.tolerance} - ${lvl.targetHz + lvl.tolerance} Hz`;
    
    songSelector.value = currentSongIdx;
    renderLyrics();

    timeLeft = lvl.time;
    timeText.innerText = `${timeLeft} วินาที`;
    timerFill.style.width = "100%";
    feedbackBox.innerText = "พร้อมแล้วกดเริ่มเลย!";
    feedbackBox.style.background = "rgba(255,255,255,0.05)";
    feedbackBox.style.color = "white";
    currentHzDisplay.innerText = "-- Hz";
    scoreDisplay.innerText = "0%";
    startBtn.style.display = "block";
    startBtn.disabled = false;
    startBtn.innerText = "🎤 กดเพื่อเริ่มจับเสียง";
    nextBtn.style.display = "none";
  }

  levelSelector.addEventListener('change', (e) => {
    currentLevelIdx = parseInt(e.target.value);
    stopGameEarly();
    loadSettings();
  });

  songSelector.addEventListener('change', (e) => {
    currentSongIdx = parseInt(e.target.value);
    renderLyrics();
  });

  function stopGameEarly() {
    if (isRunning) {
      isRunning = false;
      clearInterval(gameTimer);
      if (stream) stream.getTracks().forEach(t => t.stop());
    }
  }

  loadSettings();

  function autoCorrelate(buf, sampleRate) {
    let SIZE = buf.length, rms = 0;
    for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
    rms = Math.sqrt(rms / SIZE);
    if (rms < 0.015) return -1;
    
    let r1 = 0, r2 = SIZE - 1, thres = 0.2;
    for (let i = 0; i < SIZE / 2; i++) { if (Math.abs(buf[i]) < thres) { r1 = i; break; } }
    for (let i = 1; i < SIZE / 2; i++) { if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; } }
    buf = buf.slice(r1, r2); SIZE = buf.length;
    let c = new Array(SIZE).fill(0);
    for (let i = 0; i < SIZE; i++) {
      for (let j = 0; j < SIZE - i; j++) c[i] += buf[j] * buf[j + i];
    }
    let d = 0; while (c[d] > c[d + 1]) d++;
    let maxval = -1, maxpos = -1;
    for (let i = d; i < SIZE; i++) {
      if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
    }
    return sampleRate / maxpos;
  }

  startBtn.onclick = async () => {
    try {
      totalFrames = 0; goodFrames = 0;
      levelSelector.disabled = true;
      songSelector.disabled = true;

      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      await audioCtx.resume();
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      audioCtx.createMediaStreamSource(stream).connect(analyser);
      dataArray = new Float32Array(analyser.fftSize);

      isRunning = true;
      startBtn.disabled = true;
      startBtn.innerText = "กำลังจับเสียงร้อง...";
      
      updateKaraoke(timeLeft);
      
      gameTimer = setInterval(() => {
        timeLeft--;
        let pct = (timeLeft / levels[currentLevelIdx].time) * 100;
        timerFill.style.width = pct + "%";
        timeText.innerText = `${timeLeft} วินาที`;

        updateKaraoke(timeLeft);

        if (timeLeft <= 0) endGame();
      }, 1000);

      updatePitch();
    } catch (err) {
      alert("กรุณาอนุญาตการใช้ไมโครโฟนบนเบราว์เซอร์ก่อนเล่นเกมครับ");
      levelSelector.disabled = false;
      songSelector.disabled = false;
    }
  };

  function updatePitch() {
    if (!isRunning) return;
    analyser.getFloatTimeDomainData(dataArray);
    let pitch = autoCorrelate(dataArray, audioCtx.sampleRate);
    let lvl = levels[currentLevelIdx];

    if (pitch !== -1) {
      let hz = Math.round(pitch);
      currentHzDisplay.innerText = hz + " Hz";
      totalFrames++;

      let minHz = lvl.targetHz - lvl.tolerance;
      let maxHz = lvl.targetHz + lvl.tolerance;

      if (hz >= minHz && hz <= maxHz) {
        feedbackBox.innerText = "🎯 เป๊ะมาก! ค้างไว้";
        feedbackBox.style.background = "rgba(34, 197, 94, 0.2)";
        feedbackBox.style.color = "var(--success-color)";
        goodFrames++;
      } else if (hz > maxHz) {
        feedbackBox.innerText = "⬇️ สูงไป ลดเสียงลงนิด";
        feedbackBox.style.background = "rgba(239, 68, 68, 0.2)";
        feedbackBox.style.color = "var(--danger-color)";
      } else {
        feedbackBox.innerText = "⬆️ ต่ำไป ดันเสียงขึ้นอีก";
        feedbackBox.style.background = "rgba(245, 158, 11, 0.2)";
        feedbackBox.style.color = "var(--warning-color)";
      }

      let percent = Math.round((goodFrames / totalFrames) * 100);
      scoreDisplay.innerText = percent + "%";
    }
    requestAnimationFrame(updatePitch);
  }

  function endGame() {
    isRunning = false;
    clearInterval(gameTimer);
    if (stream) stream.getTracks().forEach(t => t.stop());
    
    startBtn.style.display = "none";
    levelSelector.disabled = false;
    songSelector.disabled = false;
    
    let finalScore = totalFrames > 0 ? Math.round((goodFrames / totalFrames) * 100) : 0;
    
    let modal = document.getElementById('result-modal');
    let title = document.getElementById('modal-title');
    let scoreText = document.getElementById('modal-score');
    let closeBtn = document.getElementById('close-modal-btn');
    
    scoreText.innerText = finalScore + "%";

    if (finalScore >= 50) {
      title.innerText = "🎉 ผ่านด่าน!";
      title.style.color = "var(--success-color)";
      if (currentLevelIdx < levels.length - 1) {
        nextBtn.style.display = "block";
        closeBtn.innerText = "ลุยด่านต่อไป!";
        closeBtn.onclick = () => {
          modal.style.display = "none";
          currentLevelIdx++;
          loadSettings();
        };
      } else {
        title.innerText = "🏆 เคลียร์เกมสมบูรณ์!";
        closeBtn.innerText = "เล่นใหม่ตั้งแต่ต้น";
        closeBtn.onclick = () => {
          modal.style.display = "none";
          currentLevelIdx = 0;
          loadSettings();
        };
      }
    } else {
      title.innerText = "❌ ยังไม่ผ่าน";
      title.style.color = "var(--danger-color)";
      nextBtn.style.display = "none";
      startBtn.style.display = "block";
      closeBtn.innerText = "ลองใหม่อีกครั้ง";
      closeBtn.onclick = () => {
        modal.style.display = "none";
        loadSettings();
      };
    }
    
    modal.style.display = "flex";
  }
</script>

</body>
</html>
